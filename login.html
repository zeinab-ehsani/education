<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>Login</title>
    <link rel="stylesheet" href="./src/output.css">

</head>

<body>
    <section class="min-h-dvh md:h-dvh w-full flex flex-row justify-evenly p-4 md:py-10 md:ps-10 md:pe-12 2xl:pe-24">

        <div class="hidden img-login md:flex w-[51%] flex-col justify-end md:pl-10 xl:pl-16 pb-10 xl:pb-14 rounded-3xl  bg-cover bg-center"
            style="background-image: url(./assets/img/login/login.svg);">
            <h6 class="text-2xl xl:text-4xl text-white font-bold">Lorem Ipsum is simply</h6>
            <p class="text-lg xl:text-2xl text-white">Lorem Ipsum is simply</p>
        </div>

        <div class="w-full md:w-[45%] xl:w-[31%] flex flex-col justify-center gap-4 xl:gap-6">

            <div class="flex flex-col gap-4 xl:gap-6">
                <h4 class="text-center text-xl md:text-2xl font-semibold">Welcome to learning !</h4>

                <div class="flex w-full rounded-full bg-[#49BBBD]/60 p-2 box-border">
                    <button id="loginTab" type="button"
                        class="flex-1 bg-[#49BBBD99] rounded-full py-2 xl:py-3 text-white text-sm xl:text-base login-btn">Login</button>
                    <button id="registerTab" type="button"
                        class="flex-1 rounded-full  py-2 xl:py-3 text-white text-sm xl:text-base signin-btn">Register</button>
                </div>
            </div>

            <p class="text-sm xl:text-base text-[#5B5B5B]">
                Lorem Ipsum is simply dummy text of the printing and typesetting industry.
            </p>

            <form id="loginForm" class="flex flex-col gap-5 xl:gap-[30px] form-login" action="#">
                <div>
                    <label for="username" class="block mb-2">User name</label>
                    <input id="username" type="text" placeholder="Enter your User name"
                        class="input input-bordered w-full rounded-full ps-6 xl:ps-8">
                </div>

                <div class="relative">
                    <label for="password" class="block mb-2">Password</label>
                    <input id="password" type="password" placeholder="Enter your Password"
                        class="input input-bordered w-full rounded-full ps-6 xl:ps-8">
                    <button type="button" id="togglePassword" class="absolute right-4 top-[72%] -translate-y-1/2">
                        <i id="eyeIcon" class="bi bi-eye-slash"></i>
                    </button>
                </div>

                <div class="flex flex-col gap-2 sm:flex-row sm:justify-between text-sm xl:text-base">
                    <div class="flex items-center gap-2">
                        <input id="remember" name="rememberme" type="checkbox" class="checkbox checkbox-sm">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#">Forgot Password ?</a>
                </div>

                <button class="bg-[#49BBBD99] text-white py-3 rounded-[36px] w-full md:w-1/2 self-end">
                    <a class="text-white " href="./course.html">                    Login
</a>
                
                </button>
            </form>

            <form id="registerForm" class="hidden flex flex-col gap-5 xl:gap-[30px] form-register" action="#">
                <div>
                    <label for="email" class="block mb-2">Email Address</label>
                    <input id="email" type="email" placeholder="Enter your Email Address"
                        class="input input-bordered w-full rounded-full ps-6 xl:ps-8">
                </div>

                <div>
                    <label for="username2" class="block mb-2">User name</label>
                    <input id="username2" type="text" placeholder="Enter your User name"
                        class="input input-bordered w-full rounded-full ps-6 xl:ps-8">
                </div>

                <div class="relative">
                    <label for="password2" class="block mb-2">Password</label>
                    <input id="password2" type="password" placeholder="Enter your Password"
                        class="input input-bordered w-full rounded-full ps-6 xl:ps-8">
                    <button type="button" id="togglePassword2" class="absolute right-4 top-[71%] -translate-y-1/2">
                        <i id="eyeIcon2" class="bi bi-eye-slash"></i>
                    </button>
                </div>



                <button class="bg-[#49BBBD99] text-white py-3 rounded-[36px] w-full md:w-1/2 self-end">Register</button>
            </form>
        </div>
    </section>

    <script>
        let togglePassword = document.querySelector("#togglePassword")
        let password = document.querySelector("#password")
        const eyeIcon = document.getElementById("eyeIcon")
        togglePassword.addEventListener("click", function () {

            const isHidden = password.type === "password";
            password.type = isHidden ? "text" : "password";
            eyeIcon.className = isHidden ? "bi bi-eye" : "bi bi-eye-slash";
        })

  let togglePassword2 = document.querySelector("#togglePassword2")
        let password2 = document.querySelector("#password2")
        const eyeIcon2 = document.getElementById("eyeIcon2")
        togglePassword2.addEventListener("click", function () {

            const isHidden = password2.type === "password";
            password2.type = isHidden ? "text" : "password";
            eyeIcon2.className = isHidden ? "bi bi-eye" : "bi bi-eye-slash";
        })

        let formLogin = document.querySelector(".form-login")
        let formRegister = document.querySelector(".form-register")

        let loginBtn = document.querySelector(".login-btn")
        let signinBtn = document.querySelector(".signin-btn")
        let imgLogin = document.querySelector(".img-login")

        loginBtn.addEventListener("click", function () {

            formRegister.classList.add("hidden")
            formLogin.classList.remove("hidden")
            loginBtn.classList.add("bg-[#49BBBD99]")
            signinBtn.classList.remove("bg-[#49BBBD99]")
            imgLogin.style.backgroundImage = 'url("./assets/img/login/login.svg")'

        })
        signinBtn.addEventListener("click", function () {

            formRegister.classList.remove("hidden")
            formLogin.classList.add("hidden")

            signinBtn.classList.add("bg-[#49BBBD99]")
            loginBtn.classList.remove("bg-[#49BBBD99]")
            imgLogin.style.backgroundImage = 'url("./assets/img/login/signin.svg")'


        })
    </script>
</body>

</html>
